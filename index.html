<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Grey Surprise 🩶</title>
<style>
body{margin:0;background:#0f0f0f;color:#ccc;font-family:Arial,sans-serif;overflow-x:hidden}
.hero{height:100vh;display:flex;flex-direction:column;justify-content:center;align-items:center;background:radial-gradient(#222,#0f0f0f);text-align:center}
.hero h1{font-size:60px;animation:beat 1.5s infinite}
@keyframes beat{0%,100%{transform:scale(1)}50%{transform:scale(1.1)}}
section{padding:70px 20px;max-width:800px;margin:auto}
h2{text-align:center;color:#777;letter-spacing:4px;font-size:14px;text-transform:uppercase;margin-bottom:35px}
.message{background:#181818;border:1px solid #2a2a2a;padding:40px;border-radius:20px;text-align:center;font-size:22px;line-height:1.8;font-style:italic}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:15px}
.grid img{width:100%;height:260px;object-fit:cover;border-radius:15px;filter:grayscale(100%);transition:.6s}
.grid img:hover{filter:grayscale(0%);transform:scale(1.03)}
.music{ background:#1a1a1a;padding:30px;border-radius:20px;text-align:center;border:1px solid #333}
audio{width:100%;margin-top:15px}
.btn{display:block;margin:40px auto;padding:16px 50px;background:#d1d1d1;color:#000;border:none;border-radius:50px;font-weight:bold;cursor:pointer}
.btn:hover{background:white;transform:scale(1.05)}
#final{display:none;text-align:center}
</style>
</head>
<body>

<div class="hero">
<h1>🩶</h1>
<p style="color:#555;letter-spacing:5px;">FOR YOU</p>
</div>

<section>
<h2>💌 Message for you</h2>
<div class="message">
when you say you love me<br>
now I love you more<br><br>
and when you say you love me<br>
now I love you more 🩶
</div>
</section>

<section>
<h2>📸 Mr. Handsome</h2>
<div class="grid">
<img src="IMG-20260924-WA0101.jpg">
<img src="IMG-20260924-WA0091.jpg">
<img src="IMG-20260924-WA0105.jpg">
<img src="IMG-20260924-WA0104.jpg">
</div>
</section>

<section>
<h2>🎵 Music</h2>
<div class="music">
<p style="color:#999;">Zac Efron, Zendaya - Rewrite The Stars</p>
<audio controls autoplay loop>
<source src="music.mp3" type="audio/mpeg">
</audio>
</div>
</section>

<section>
<h2>🎁 My Final Words</h2>
<button class="btn" onclick="document.getElementById('final').style.display='block';window.scrollTo({top:document.body.scrollHeight,behavior:'smooth'})">FUNGUA SURPRISE ✨</button>
<div id="final">
<h1 style="font-size:28px;font-style:italic;line-height:1.5;">when you say you love me<br>now I love you more 🩶</h1>
<p style="color:#666;margin-top:20px;">✨ you make my grey world colorful ✨</p>
<img src="IMG-20260924-WA0105.jpg" style="width:80%;max-width:300px;border-radius:20px;margin-top:25px;filter:grayscale(100%)">
</div>
</section>

</body>
  </html>
