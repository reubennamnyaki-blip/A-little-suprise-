<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For You</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0f0f0f;color:#aaa;font-family:serif;text-align:center}
.hero{height:100vh;display:flex;flex-direction:column;justify-content:center;align-items:center}
.hero h1{font-size:90px}
.hero p{letter-spacing:8px;color:#444;margin-top:20px;font-size:14px}
.section{padding:60px 20px;max-width:700px;margin:auto}
.quote{background:#1a1a1a;padding:30px;border-radius:20px;font-style:italic;line-height:1.8}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:30px}
.grid img{width:100%;height:230px;object-fit:cover;border-radius:18px;filter:grayscale(100%)}
.music{margin-top:40px;background:#181818;padding:25px;border-radius:20px}
.btn{margin-top:50px;padding:16px 40px;background:white;color:black;border:none;border-radius:50px;font-weight:bold;cursor:pointer;font-size:16px}
#final{display:none;margin-top:60px;padding-bottom:100px}
#final h1{font-size:55px;color:white;margin-bottom:15px}
#final img{width:90%;max-width:400px;height:500px;object-fit:cover;border-radius:25px;filter:grayscale(100%);margin-top:20px}
</style>
</head>
<body>

<div class="hero">
<h1>🩶</h1>
<p>FOR YOU</p>
</div>

<div class="section">
<div class="quote">when you say you love me<br>now I love you more 🩶</div>

<div class="grid">
<img src="IMG-20260924-WA0101.jpg">
<img src="IMG-20260924-WA0091.jpg">
<img src="IMG-20260924-WA0105.jpg">
<img src="IMG-20260924-WA0104.jpg">
</div>

<div class="music">
<p style="margin-bottom:15px">🎵 Adore You - Cedric Gervais</p>
<iframe width="100%" height="200" style="border-radius:12px" src="https://www.youtube.com/embed/7MQ2nVohQ8U" frameborder="0" allowfullscreen></iframe>
</div>

<button class="btn" id="myBtn" onclick="document.getElementById('final').style.display='block';document.getElementById('myBtn').style.display='none';document.getElementById('final').scrollIntoView({behavior:'smooth'})">my final words ✨</button>

<div id="final">
<h1>I love you ❤️❤️</h1>
<p>you make my grey world colorful</p>
<img src="IMG-20260924-WA0105.jpg">
</div>

</div>
</body>
</html>
