<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>A Little Surprise 🤍</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

html{
  scroll-behavior:smooth;
}

body{
  font-family:Arial, sans-serif;
  background:#0d0d0f;
  color:#f5f5f5;
  overflow-x:hidden;
}

/* BACKGROUND */
body::before{
  content:"";
  position:fixed;
  inset:0;
  background:
    radial-gradient(circle at 20% 20%,#5555,transparent 25%),
    radial-gradient(circle at 80% 70%,#7773,transparent 25%);
  pointer-events:none;
  z-index:-1;
}

/* HERO */
.hero{
  min-height:100vh;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  text-align:center;
  padding:30px;
  background:linear-gradient(145deg,#090909,#303033,#111113);
}

.hero small{
  letter-spacing:5px;
  color:#aaa;
  text-transform:uppercase;
}

.hero h1{
  font-size:clamp(42px,9vw,85px);
  margin:25px 0;
  background:linear-gradient(90deg,#fff,#777,#fff);
  -webkit-background-clip:text;
  color:transparent;
}

.hero p{
  max-width:550px;
  color:#bbb;
  line-height:1.8;
}

.btn{
  margin-top:35px;
  padding:15px 35px;
  border:1px solid #888;
  border-radius:50px;
  background:#ffffff12;
  color:white;
  cursor:pointer;
  transition:.3s;
  backdrop-filter:blur(10px);
}

.btn:hover{
  background:#fff;
  color:#111;
  transform:scale(1.06);
}

/* SECTIONS */
section{
  padding:100px 20px;
  text-align:center;
}

.title{
  font-size:38px;
  margin-bottom:20px;
}

.subtitle{
  color:#999;
  margin-bottom:45px;
}

/* MESSAGE */
.message{
  max-width:700px;
  margin:auto;
  padding:45px;
  background:linear-gradient(145deg,#1d1d20,#101012);
  border:1px solid #444;
  border-radius:25px;
  box-shadow:0 20px 60px #000;
}

.message p{
  color:#ccc;
  line-height:2;
}

/* PHOTOS */
.gallery{
  max-width:900px;
  margin:auto;
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:20px;
}

.photo{
  height:300px;
  border-radius:20px;
  overflow:hidden;
  border:1px solid #444;
  background:#222;
}

.photo img{
  width:100%;
  height:100%;
  object-fit:cover;
  transition:.6s;
}

.photo:hover img{
  transform:scale(1.08);
}

.memory{
  max-width:700px;
  margin:25px auto;
  padding:30px;
  border-left:2px solid #888;
  background:#181
